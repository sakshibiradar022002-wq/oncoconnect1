name: Uptime Watch

# Pings /api/health every 30 minutes. On failure (after 2 consecutive
# misses to avoid flapping) it opens an issue titled with the date; on
# recovery it closes the open outage issue automatically.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health check
        id: hc
        run: |
          SITE=https://veltruvia.duckdns.org
          JSON=$(curl -s --max-time 20 -o /tmp/health.json -w "%{http_code}" "$SITE/api/health" || echo "000")
          echo "status=$JSON" >> "$GITHUB_OUTPUT"
          if [ "$JSON" = "200" ] && grep -q '"ok":true' /tmp/health.json; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open outage issue
        if: steps.hc.outputs.healthy == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '(no response body)';
            try { body = fs.readFileSync('/tmp/health.json', 'utf8').slice(0, 500); } catch {}
            const title = '🔴 Site down — ' + new Date().toISOString().slice(0, 10);
            const marker = '<!-- uptime-watch -->';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'uptime', per_page: 10,
            });
            const existing = issues.data.find(i => i.title.startsWith('🔴 Site down'));
            const now = new Date().toISOString();
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: marker + '\nStill down at ' + now + ' (HTTP ' + '${{ steps.hc.outputs.status }}' + ')\n```\n' + body + '\n```',
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['uptime'],
                body: marker + '\nHealth check failed at ' + now + ' (HTTP ' + '${{ steps.hc.outputs.status }}' + ').\n```\n' + body + '\n```\nNext update in 30 min.',
              });
            }

      - name: Close resolved outages
        if: steps.hc.outputs.healthy == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'uptime', per_page: 10,
            });
            for (const issue of issues.data) {
              if (issue.title.startsWith('🔴 Site down')) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number,
                  body: '<!-- uptime-watch -->\n✅ Recovered at ' + new Date().toISOString(),
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, state: 'closed',
                });
              }
            }
