name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        working-directory: VELTRUVIA Server/resources/app
      - name: Run checks
        run: npm run check
        working-directory: VELTRUVIA Server/resources/app
      - name: Run test suite
        run: npm test
        working-directory: VELTRUVIA Server/resources/app
        timeout-minutes: 8
