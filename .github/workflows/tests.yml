name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # engines.node is 24.x; the writer-lock regression only appeared on
        # Node >= 22, so CI now covers the boundary instead of just 20.
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install bundle dependencies
        run: npm ci
        working-directory: VELTRUVIA Server/resources/app
      - name: Repo gate (canonical bundles, syntax, drift)
        run: node check.mjs
      - name: Bundle checks
        run: npm run check
        working-directory: VELTRUVIA Server/resources/app
      - name: Bundle API suite
        run: npm test
        working-directory: VELTRUVIA Server/resources/app
        timeout-minutes: 8
      - name: Install client app dependencies
        run: |
          for app in "VELTRUVIA Doctor" "VELTRUVIA Patient" "VELTRUVIA Lab"; do
            (cd "$app/resources/app" && npm ci)
          done
        timeout-minutes: 10
      - name: Feature verification (90 checks × 4 apps)
        run: node scripts/verify-all.mjs
        timeout-minutes: 12
      # The root suite (hardening, imaging, anomaly scan, offsite backup,
      # heartbeat) is where the regressions that matter live. It resolves the
      # bundle's node_modules, so no separate root install is required.
      - name: Root suite (hardening, imaging, scripts)
        run: npm test
        timeout-minutes: 10
